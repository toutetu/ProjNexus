<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ログイン（改善候補：A 案 / 1 カラム・ログイン最優先） — JPT 開発管理</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet" />
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
  :root{
    --jpt-red:#E60013; --jpt-dark:#212429; --jpt-bg:#F8F9FA; --jpt-muted:#6C757D;
    --jpt-border:#DEE2E6; --jpt-blue:#106EBE; --jpt-cyan:#01CFFF; --jpt-purple:#6D28D9;
  }
  html,body{font-family:"Noto Sans JP",sans-serif;color:var(--jpt-dark);background:var(--jpt-bg);}
  .role.on{border-color:var(--jpt-blue);background:#EAF3FB;color:var(--jpt-blue);}
</style>
</head>
<body class="min-h-screen flex flex-col items-center px-4 pt-12 sm:justify-center sm:pt-0">

  <!-- ブランド -->
  <div class="mb-6 text-center">
    <div class="mx-auto mb-3 flex h-14 w-14 items-center justify-center rounded-xl text-white"
         style="background:linear-gradient(135deg,var(--jpt-cyan),var(--jpt-blue),var(--jpt-purple))">
      <i data-lucide="boxes" class="h-8 w-8"></i>
    </div>
    <p class="text-[11px] font-medium" style="color:var(--jpt-muted)">開発管理アプリ</p>
    <p class="text-lg font-bold tracking-wide">ProjNexus</p>
  </div>

  <!-- ログインカード（主役） -->
  <div class="w-full max-w-md rounded-lg border bg-white px-6 py-6 shadow-sm" style="border-color:var(--jpt-border)">
    <h1 class="text-xl font-bold">ログイン</h1>

    <p class="mt-5 text-xs font-medium" style="color:var(--jpt-muted)">デモアカウントを選ぶ</p>
    <div class="mt-2 grid grid-cols-3 gap-2" id="roles">
      <button type="button" class="role flex flex-col items-center gap-1 rounded-md border bg-white px-2 py-2.5 text-xs font-medium text-gray-600" style="border-color:var(--jpt-border)" data-mail="applicant@example.com">
        <i data-lucide="user-round" class="h-4 w-4"></i>申請者
      </button>
      <button type="button" class="role on flex flex-col items-center gap-1 rounded-md border bg-white px-2 py-2.5 text-xs font-medium text-gray-600" style="border-color:var(--jpt-border)" data-mail="dept@example.com">
        <i data-lucide="users" class="h-4 w-4"></i>部門管理者
      </button>
      <button type="button" class="role flex flex-col items-center gap-1 rounded-md border bg-white px-2 py-2.5 text-xs font-medium text-gray-600" style="border-color:var(--jpt-border)" data-mail="hq@example.com">
        <i data-lucide="building-2" class="h-4 w-4"></i>本部管理者
      </button>
    </div>

    <label class="mt-5 block text-sm font-medium text-gray-700" for="email">メールアドレス</label>
    <input id="email" type="email" value="dept@example.com" class="mt-1 block w-full rounded-md border px-3 py-2 text-sm" style="border-color:var(--jpt-border)" />

    <label class="mt-4 block text-sm font-medium text-gray-700" for="password">パスワード<span class="text-xs">：password</span></label>
    <input id="password" type="password" class="mt-1 block w-full rounded-md border px-3 py-2 text-sm" style="border-color:var(--jpt-border)" />

    <label class="mt-4 flex items-center text-sm text-gray-600">
      <input type="checkbox" class="rounded border-gray-300" />
      <span class="ms-2">ログイン状態を保持する</span>
    </label>

    <button type="button" class="mt-6 h-11 w-full rounded-md text-base font-medium text-white shadow-sm" style="background:var(--jpt-red)">ログイン</button>

    <div class="mt-5 text-center">
      <button type="button" class="inline-flex items-center gap-1 text-xs text-gray-500 hover:text-gray-800">
        ほかのテストユーザーを見る <i data-lucide="chevron-down" class="h-3.5 w-3.5"></i>
      </button>
    </div>
  </div>

  <!-- 紹介リンク（カードの外に控えめに） -->
  <div class="mt-5 flex flex-wrap justify-center gap-5 text-sm font-medium" style="color:var(--jpt-blue)">
    <a href="/manual?view=about" target="_blank" rel="noopener" class="inline-flex items-center gap-1.5 hover:underline"><i data-lucide="info" class="h-4 w-4"></i>このアプリについて</a>
    <a href="https://github.com/toutetu/ProjNexus" target="_blank" rel="noopener noreferrer" class="inline-flex items-center gap-1.5 hover:underline"><i data-lucide="code-2" class="h-4 w-4"></i>GitHub</a>
    <a href="https://lean-fifth-9ca.notion.site/ProjNexus-352421fa099e80138774cc647cc76b57" target="_blank" rel="noopener noreferrer" class="inline-flex items-center gap-1.5 hover:underline"><i data-lucide="file-text" class="h-4 w-4"></i>Notion</a>
  </div>
  <a href="/manual" target="_blank" rel="noopener" class="mt-3 mb-10 inline-flex items-center gap-1.5 text-xs text-gray-500 hover:text-gray-800 hover:underline">
    <i data-lucide="book-open" class="h-3.5 w-3.5"></i>操作マニュアル
  </a>

<script>
  lucide.createIcons();
  document.querySelectorAll('#roles .role').forEach(function (b) {
    b.addEventListener('click', function () {
      document.querySelectorAll('#roles .role').forEach(function (x) { x.classList.remove('on'); });
      b.classList.add('on');
      document.getElementById('email').value = b.dataset.mail;
      document.getElementById('password').value = 'password';
    });
  });
</script>
</body>
</html>
